<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stretch Tones</title>
<link rel="icon" href="public/favicon.ico">
<style>
  html, body { margin:0; height:100%; background:#000; }
  button#playBtn {
    position:fixed; top:calc(20px + env(safe-area-inset-top)); left:20px;
    width:64px; height:64px; padding:0; border:0; background:none; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button#playBtn img { width:100%; height:100%; display:block; }
  #loader {
    position:fixed; top:calc(28px + env(safe-area-inset-top)); left:96px;
    width:32px; height:32px; display:none;
  }
  #loader.show { display:block; }
</style>

<button id="playBtn" aria-label="Play"><img id="playIcon" src="public/images/play.png" alt=""></button>
<img id="loader" src="public/images/loader.gif" alt="">

<script type="module">
  import { createPlayer } from './sync-engine.js';

  // one stereo file per phone/channel — no splitting needed, these are already per-channel mixes
  // AAC/m4a, ~25MB each (down from 62MB MP3s) — smaller payload buffers fully before
  // a locked phone throttles background fetches, which is what was causing playback
  // interruptions with the old files
  const CHANNELS = [
    'public/assets/StretchTones_Tracks/Track1.m4a',
    'public/assets/StretchTones_Tracks/Track2.m4a',
    'public/assets/StretchTones_Tracks/Track3.m4a',
    'public/assets/StretchTones_Tracks/Track4.m4a',
    'public/assets/StretchTones_Tracks/Track5.m4a',
    'public/assets/StretchTones_Tracks/Track6.m4a',
    'public/assets/StretchTones_Tracks/Track7.m4a',
  ];

  // exact PCM sample count / sample rate (70220736 / 44100) — container-reported duration is off by ~48ms
  const DURATION = 1592.3069387755102;

  const player = createPlayer({
    channels: CHANNELS,
    duration: DURATION,
    title: 'Stretch Tones',
  });

  const btn = document.getElementById('playBtn');
  const icon = document.getElementById('playIcon');
  const loader = document.getElementById('loader');

  function paint() {
    icon.src = player.playing ? 'public/images/stop.png' : 'public/images/play.png';
    btn.setAttribute('aria-label', player.playing ? 'Pause' : 'Play');
  }

  btn.addEventListener('click', () => { player.toggle(); paint(); });

  // the loader stays lit until the file is FULLY buffered, not just "enough to play through" —
  // full buffering is the point at which lock-screen playback stops depending on the network
  function fullyBuffered() {
    const b = player.audio.buffered;
    return b.length > 0 && b.end(b.length - 1) >= DURATION - 0.25;
  }
  function refreshLoader() {
    loader.classList.toggle('show', !fullyBuffered());
  }

  player.audio.addEventListener('progress', refreshLoader);
  player.audio.addEventListener('waiting',  () => loader.classList.add('show'));
  player.audio.addEventListener('playing',  () => { refreshLoader(); paint(); });
  player.audio.addEventListener('pause',    () => paint());
  refreshLoader();
</script>
