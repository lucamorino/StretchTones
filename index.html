<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stretch Tones</title>
<link rel="icon" href="public/favicon.ico">
<style>
  html, body { margin:0; height:100%; background:#000; }
  button#playBtn {
    position:fixed; top:calc(20px + env(safe-area-inset-top)); left:20px;
    width:64px; height:64px; padding:0; border:0; background:none; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  button#playBtn img { width:100%; height:100%; display:block; }
  button#playBtn[disabled] { opacity:.35; cursor:default; }
  #loader {
    position:fixed; top:calc(28px + env(safe-area-inset-top)); left:96px;
    width:32px; height:32px; display:none;
  }
  #loader.show { display:block; }
  #pct {
    position:fixed; top:calc(30px + env(safe-area-inset-top)); left:136px;
    color:#fff; font:12px/32px ui-monospace, monospace; letter-spacing:.05em;
    display:none;
  }
  #pct.show { display:block; }
</style>

<button id="playBtn" aria-label="Loading" disabled><img id="playIcon" src="public/images/play.png" alt=""></button>
<img id="loader" src="public/images/loader.gif" alt="">
<span id="pct"></span>

<script type="module">
  import { createPlayer } from './sync-engine.js';

  // one stereo file per phone/channel — no splitting needed, these are already per-channel mixes
  // AAC/m4a, ~25MB each
  const CHANNELS = [
    'public/assets/StretchTones_Tracks/Track1.m4a',
    'public/assets/StretchTones_Tracks/Track2.m4a',
    'public/assets/StretchTones_Tracks/Track3.m4a',
    'public/assets/StretchTones_Tracks/Track4.m4a',
    'public/assets/StretchTones_Tracks/Track5.m4a',
    'public/assets/StretchTones_Tracks/Track6.m4a',
    'public/assets/StretchTones_Tracks/Track7.m4a',
  ];

  // exact PCM sample count / sample rate (70220736 / 44100) — container-reported duration is off by ~48ms
  const DURATION = 1592.3069387755102;

  const btn = document.getElementById('playBtn');
  const icon = document.getElementById('playIcon');
  const loader = document.getElementById('loader');
  const pct = document.getElementById('pct');

  // The whole file is fetched into memory as a Blob before the button is ever
  // enabled — see sync-engine.js for why (iOS won't reliably preload media in
  // the background, so "tap then pocket the phone" can otherwise outrun the
  // download). Once ready() fires, playback has zero further network dependency.
  const player = createPlayer({
    channels: CHANNELS,
    duration: DURATION,
    title: 'Stretch Tones',
    onProgress: frac => {
      loader.classList.add('show');
      pct.classList.add('show');
      pct.textContent = Math.round(frac * 100) + '%';
    },
  });

  function paint() {
    icon.src = player.playing ? 'public/images/stop.png' : 'public/images/play.png';
    btn.setAttribute('aria-label', player.playing ? 'Pause' : 'Play');
  }

  btn.addEventListener('click', () => { player.toggle(); paint(); });

  // reflect play/pause triggered from the OS lock-screen controls, not just this button
  player.audio.addEventListener('playing', paint);
  player.audio.addEventListener('pause',   paint);

  player.whenReady.then(() => {
    btn.disabled = false;
    btn.setAttribute('aria-label', 'Play');
    loader.classList.remove('show');
    pct.classList.remove('show');
  });
</script>
